<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">

    <script>
        (function () {
            var theme = localStorage.getItem('cv-theme')
            document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        })()
    </script>

    <style>
        :root {
            color-scheme: dark;
            --background: #121212;
            --text: #ffffff;
            --text-faint: #848484;
            --text-muted: #bdbdbd;
            --page-margin: clamp(1.25rem, 4vw, 3rem);
            --ghost: rgba(255, 255, 255, 0.035);
        }

        [data-theme="light"] {
            color-scheme: light;
            --background: #f9f9f9;
            --text: #1a1c1c;
            --text-faint: #848484;
            --text-muted: #5f5e5e;
            --ghost: rgba(26, 28, 28, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--background);
            color: var(--text);
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button {
            border: 0;
            background: transparent;
            cursor: pointer;
            color: inherit;
            font: inherit;
        }

        .topbar {
            display: flex;
            justify-content: flex-end;
            padding: 1.35rem var(--page-margin);
        }

        .theme-toggle {
            display: inline-grid;
            place-items: center;
            width: 2rem;
            height: 2rem;
            padding: 0;
            color: var(--text-muted);
            transition: color 160ms ease;
        }

        .theme-toggle:hover {
            color: var(--text);
        }

        .theme-icon {
            width: 1.15rem;
            height: 1.15rem;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .theme-icon-moon {
            fill: currentColor;
            stroke: none;
        }

        .theme-icon-sun {
            display: none;
        }

        [data-theme="light"] .theme-icon-moon {
            display: none;
        }

        [data-theme="light"] .theme-icon-sun {
            display: block;
        }

        .stage {
            position: relative;
            flex: 1;
            display: grid;
            place-items: center;
            padding: clamp(2.5rem, 8vw, 6rem) var(--page-margin);
            overflow: hidden;
        }

        .ghost-404 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            font-size: clamp(18rem, 58vw, 44rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--ghost);
            user-select: none;
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        .code {
            position: relative;
            z-index: 1;
            margin: 0;
            font-size: clamp(6rem, 22vw, 13rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.03em;
            background: linear-gradient(160deg, var(--text) 35%, var(--text-faint));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body>
<header class="topbar">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M20.2 15.6A8.4 8.4 0 0 1 8.4 3.8a8.8 8.8 0 1 0 11.8 11.8Z"/>
        </svg>
        <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
        </svg>
    </button>
</header>

<main class="stage">
    <p class="ghost-404" aria-hidden="true">404</p>
    <h1 class="code">404</h1>
</main>

<script>
    (function () {
        var key = 'cv-theme'
        var toggle = document.getElementById('theme-toggle')

        toggle.addEventListener('click', function () {
            var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
            document.documentElement.dataset.theme = next
            localStorage.setItem(key, next)
        })
    })()
</script>
</body>
</html>
